[package]
name = "tokimo-package-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP (Model Context Protocol) client — protocol types, transports, client/connection"


[dependencies]
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "macros", "rt", "process", "io-util", "time"] }
tokio-stream = "0.1"
futures-util = "0.3"
tracing = "0.1"
